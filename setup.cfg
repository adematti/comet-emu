[metadata]
name = comet-bncamacho
version = 0.0.7
author = Alex E.
author_email = author@example.com
description = COMET - Cosmological Observables Modelled with/by/from Emulated Theory.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://gitlab.com/aegge/pt-emulator
project_urls =
    Bug Tracker = https://gitlab.com/aegge/pt-emulator/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = .
include_package_data = True
packages = find:
python_requires = >=3.6
install_requires = numpy; matplotlib; scipy; astropy; GPy; pyDOE

[options.package_data]
data = *

[options.packages.find]
where = .
